project:
  name: petstore-example
  version: "0.1.0"

server:
  port: 8080
  host: "127.0.0.1"
  read_timeout: 30s
  write_timeout: 30s
  graceful_shutdown: 15s
  api_prefix: /api/v1

schemas:
  dir: ./schemas
  hot_reload: true

mongo:
  uri: mongodb://localhost:27017
  database: stellar_petstore
  max_pool_size: 50

graphql:
  enabled: true
  path: /graphql

middleware:
  cors:
    allowed_origins:
      - "http://localhost:3000"
      - "http://localhost:8080"
  security_headers: true
  rate_limit:
    requests_per_second: 100
    burst: 50
